name: Desktop app

# Builds installers for macOS (dmg/zip), Windows (nsis) and Linux (AppImage/deb).
# - Run it by hand (Actions > Desktop app > Run workflow) to get the installers as
#   build artifacts.
# - Push a tag like desktop-v0.2.0 to also attach them to a draft GitHub Release
#   (the tag sets the version).
# - Both need the repository variables OPENSESSION_WEB_URL and OPENSESSION_GATEWAY_URL:
#   the servers the app talks to are compiled in (scripts/build-desktop.mjs; run it
#   locally the same way).
# Code signing is used only when the secrets exist; without them the builds are
# unsigned (macOS Gatekeeper and Windows SmartScreen will warn on first launch):
#   macOS:   MAC_CSC_LINK (base64 .p12 "Developer ID Application"), MAC_CSC_KEY_PASSWORD,
#            APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID (notarization)
#   Windows: WIN_CSC_LINK (base64 .pfx), WIN_CSC_KEY_PASSWORD

on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: write # attach installers to the draft release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # The servers the app talks to are compiled in: set them as repository variables
      # (Settings > Secrets and variables > Actions > Variables).
      - name: Build and package
        shell: bash
        env:
          OPENSESSION_WEB_URL: ${{ vars.OPENSESSION_WEB_URL }}
          OPENSESSION_GATEWAY_URL: ${{ vars.OPENSESSION_GATEWAY_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "$OPENSESSION_WEB_URL" || -z "$OPENSESSION_GATEWAY_URL" ]]; then
            echo "::error::Set the OPENSESSION_WEB_URL and OPENSESSION_GATEWAY_URL repository variables (the servers the app talks to)."
            exit 1
          fi
          if [[ "$RUNNER_OS" == "macOS" && -n "$MAC_CSC_LINK" ]]; then
            export CSC_LINK="$MAC_CSC_LINK" CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD"
          elif [[ "$RUNNER_OS" == "Windows" && -n "$WIN_CSC_LINK" ]]; then
            export CSC_LINK="$WIN_CSC_LINK" CSC_KEY_PASSWORD="$WIN_CSC_KEY_PASSWORD"
          fi
          args=()
          [[ "$GITHUB_REF" == refs/tags/desktop-v* ]] && args+=(--publish --version "${GITHUB_REF#refs/tags/desktop-v}")
          node scripts/build-desktop.mjs "${args[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: opensession-desktop-${{ runner.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          if-no-files-found: error
          retention-days: 14
