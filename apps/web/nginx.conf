# Static web app. Paths like /projects and /cli-auth are client-side routes,
# so unknown paths fall back to index.html. TLS is terminated by the proxy in
# front (Dokploy's Traefik).
server {
    listen 80;
    root /usr/share/nginx/html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # CLI install scripts (curl ... | sh, irm ... | iex): plain text, always fresh.
    location ~ ^/install\.(sh|ps1)$ {
        types { }
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
