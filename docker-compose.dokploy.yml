# OpenSession on one VPS with Dokploy (docs/DEPLOY-dokploy.md).
#
# In Dokploy: Create Service > Compose > this repository, compose path
# docker-compose.dokploy.yml. Put the settings from .env.example in the Environment
# tab, attach domains in the Domains tab (web -> port 80, gateway -> port 8000,
# auth -> port 3001), and
# run scripts/vps/setup-host.sh on the server once first (gVisor, network pools).
#
# No container_name anywhere: Dokploy rewrites names, so the gateway finds itself
# ("self") and the egress proxy ("compose:egress") through Docker Compose's labels.
#
# Every service rotates its logs and has a memory cap; gateway, auth, web and egress
# have healthchecks (the gateway's: GET /health, which also checks the database). Run ONE
# gateway: terminal, browser and preview tickets are kept in its memory.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  web:
    build:
      context: .
      dockerfile: packages/app/Dockerfile
      args:
        VITE_OPENSESSION_GATEWAY_URL: ${VITE_OPENSESSION_GATEWAY_URL}
        VITE_OPENSESSION_AUTH_URL: ${VITE_OPENSESSION_AUTH_URL}
    restart: unless-stopped
    expose:
      - "80"
    logging: *logging
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Traefik routes to a container only once it is healthy: check every 2 s while it
      # starts, or each deploy answers "404 page not found" until the first 30 s check.
      start_period: 30s
      start_interval: 2s

  # Sign-in (self-hosted Better Auth). Its tables live in the same database as the
  # gateway's; it creates or updates them on start. The gateway checks its JWTs with
  # the public keys at AUTH_JWKS_URL (the internal address set below).
  auth:
    build: services/auth
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://opensession:${POSTGRES_PASSWORD}@db:5432/opensession
    expose:
      - "3001"
    logging: *logging
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    depends_on:
      db:
        condition: service_healthy

  gateway:
    build: services/gateway
    restart: unless-stopped
    env_file: .env
    environment:
      SANDBOX_GATEWAY_CONTAINER: self
      SANDBOX_EGRESS_PROXY: compose:egress
      EGRESS_CONF_DIR: /egress-conf
      EGRESS_GLOBAL_ALLOWLIST: /etc/opensession/egress-allowlist.txt
      DATABASE_URL: postgresql://opensession:${POSTGRES_PASSWORD}@db:5432/opensession
      OPENSESSION_DB: /data/opensession.db
      AUTH_JWKS_URL: http://auth:3001/api/auth/jwks
    expose:
      - "8000"
    logging: *logging
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    labels:
      # The gateway also joins every sandbox's network; Traefik must use Dokploy's.
      - traefik.docker.network=dokploy-network
    volumes:
      # Full control of Docker: this server should run nothing you don't trust it with.
      - /var/run/docker.sock:/var/run/docker.sock
      - gateway-data:/data
      - egress-conf:/egress-conf
      - ./services/egress/allowlist.txt:/etc/opensession/egress-allowlist.txt:ro
    depends_on:
      sandbox-image:
        condition: service_started
      egress:
        condition: service_started
      db:
        condition: service_healthy
      auth:
        condition: service_started

  # Builds the sandbox image (opencode-sandbox:latest) on each deploy. The gateway
  # starts one container from it per user and project.
  # It then just sleeps: a running container that uses the image keeps `docker image
  # prune --all` (Dokploy's daily Docker cleanup, "Clean unused images") from deleting
  # it while every sandbox is asleep, which would leave no image to wake them from.
  sandbox-image:
    build:
      context: services/sandbox
      args:
        OPENCODE_VERSION: ${OPENCODE_VERSION:-2.1.2}
    image: ${SANDBOX_IMAGE:-opencode-sandbox:latest}
    entrypoint: ["sleep", "infinity"]
    restart: unless-stopped
    network_mode: none
    mem_limit: 16m
    logging: *logging

  # The gateway's database. Not published and not on any sandbox network.
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: opensession
      POSTGRES_DB: opensession
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data
    logging: *logging
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opensession -d opensession"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Allowlist proxy: the only route from sandboxes to the internet.
  egress:
    build: services/egress
    restart: unless-stopped
    volumes:
      - egress-conf:/etc/squid/conf.d
    logging: *logging
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "squid", "-k", "check", "-f", "/etc/squid/squid.conf"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pg-data:
  gateway-data:
  egress-conf:
